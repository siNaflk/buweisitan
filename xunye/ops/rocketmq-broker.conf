# M4本机演示配置，使用独立数据目录，不修改用户原RocketMQ broker-dev.conf。
brokerClusterName=XunYeLocalCluster
brokerName=xunye-m4-broker
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=SYNC_FLUSH
listenPort=10911
bindAddress=127.0.0.1
brokerIP1=127.0.0.1
namesrvAddr=127.0.0.1:9876
