#--------------------------通用配置-------------------------
spring:
  application:
    name: xunye
  profiles:
    # 本机私密配置在 application-local.yml（已 gitignore）
    active: local
  jackson:
    generator:
      # Long 序列化为字符串，避免前端 JS 精度丢失（id 与金额都是 Long）
      write-numbers-as-strings: true
  task:
    scheduling:
      pool:
        size: 3
  servlet:
    multipart:
      max-file-size: 5MB

server:
  # 寻页后端端口（novel 用 8888，本项目错开）
  port: 8890

--- #---------------------数据库配置---------------------------
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/xunye?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}

--- #---------------------Redis 配置---------------------------
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 真实密码在 application-local.yml，通过 env 注入时用 REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}

--- #---------------------自定义配置---------------------------
xunye:
  # 跨域来源（App H5 开发端口、管理端前端端口）
  cors:
    allow-origins:
      # xunye-app H5 开发端口（1026）
      - http://localhost:1026
      - http://127.0.0.1:1026
      # 管理端前端预留
      - http://localhost:5173
  mq:
    enabled: ${XUNYE_MQ_ENABLED:true}
    nameserver: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
  payment:
    simulated-enabled: ${SIMULATED_PAYMENT_ENABLED:true}
    author-share-percent: 50 # M3默认购章分成50%，打赏100%入作者余额
  jwt:
    # 默认密钥仅供本机开发；生产环境必须通过 JWT_SECRET 环境变量注入（至少 32 字节）
    secret: ${JWT_SECRET:xunye-dev-secret-0123456789abcdef-0123456789abcdef}
    expire-days: 7
